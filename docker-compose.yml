services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tayjava
      POSTGRES_PASSWORD: tayjava
      POSTGRES_DB: tayjava
    ports:
      - "5432:5432"
    volumes:
      - ./db-ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayjava -d tayjava"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://tayjava:tayjava@db:5432/tayjava?sslmode=disable
      ENROLLMENT_CAP_DEFAULT: "30"
      SHUTDOWN_TIMEOUT: 10s
    depends_on:
      db:
        condition: service_healthy
